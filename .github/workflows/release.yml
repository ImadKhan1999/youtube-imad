name: Release

# Publishes a signed APK as a GitHub Release. The app checks the latest release on start
# and offers the update in-app. Run it by pushing a tag like v1.2.3, or from the Actions tab.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, e.g. 1.2.3"
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Work out the version
        id: version
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}
        run: |
          if [ -n "$INPUT_VERSION" ]; then v="$INPUT_VERSION"; else v="${GITHUB_REF_NAME#v}"; fi
          if ! echo "$v" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::Version must look like 1.2.3, got '$v'"; exit 1
          fi
          IFS=. read -r major minor patch <<< "$v"
          echo "name=$v" >> "$GITHUB_OUTPUT"
          echo "code=$((major * 10000 + minor * 100 + patch))" >> "$GITHUB_OUTPUT"

      - name: Restore the signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::The KEYSTORE_BASE64 secret is missing. Releases must be signed with the iTube release key."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Build signed release APK
        env:
          ITUBE_KEYSTORE: ${{ runner.temp }}/release.jks
          ITUBE_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          ITUBE_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          ITUBE_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          ./gradlew --stacktrace assembleRelease \
            -PitubeVersionName=${{ steps.version.outputs.name }} \
            -PitubeVersionCode=${{ steps.version.outputs.code }}
          cp app/build/outputs/apk/release/app-release.apk "iTube-${{ steps.version.outputs.name }}.apk"

      - name: Publish the release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.name }}
          name: iTube ${{ steps.version.outputs.name }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          files: iTube-${{ steps.version.outputs.name }}.apk
